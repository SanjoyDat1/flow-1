name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audio-pipeline:
    name: Audio pipeline lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio-pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: audio-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Self-test
        run: python _selftest.py

  ios-build:
    name: iOS build
    runs-on: macos-15
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build (no signing)
        run: |
          xcodebuild \
            -scheme flow \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty || true
